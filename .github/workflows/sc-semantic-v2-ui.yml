name: SC — semântica v2 interface
on:
  push:
    branches: [feat/sc-federais-semantica-v2-ui, main]
    paths:
      - tools/sc_semantic_v2_ui/**
      - tests/sc_semantic_v2_ui.test.cjs
      - data/sc-semantic-v2-ui/**
      - assets/pauta-v2.css
      - assets/pauta-filters-v2.js
      - assets/sc-federais-filters-v2-data.js
      - .github/workflows/sc-semantic-v2-ui.yml
  pull_request:
    branches: [main]
    paths:
      - tools/sc_semantic_v2_ui/**
      - tests/sc_semantic_v2_ui.test.cjs
      - data/sc-semantic-v2-ui/**
      - assets/pauta-v2.css
      - assets/pauta-filters-v2.js
      - assets/sc-federais-filters-v2-data.js
      - .github/workflows/sc-semantic-v2-ui.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: sc-semantic-v2-ui-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/sc-federais-semantica-v2-ui' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de teste
        run: |
          pip install beautifulsoup4==4.15.0 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Compilar interface a partir do modelo aprovado
        run: python tools/sc_semantic_v2_ui/build.py
      - name: Validar fronteiras, combinações e navegador
        run: python tools/sc_semantic_v2_ui/qa.py
      - name: Versionar somente saídas validadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/pauta-filters-v2.js assets/sc-federais-filters-v2-data.js data/sc-semantic-v2-ui/
          if ! git diff --cached --quiet; then
            git commit -m 'build(sc): cards e macrofiltros v2 validados [skip ci]'
            git push origin HEAD:feat/sc-federais-semantica-v2-ui
          fi
      - name: Provas da preparação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-semantic-v2-ui-prepare
          path: |
            data/sc-semantic-v2-ui/
            /tmp/sc-v2-ui-shots/
          retention-days: 14
  pr-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sc-federais-semantica-v2-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRESERVATION_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de teste
        run: |
          pip install beautifulsoup4==4.15.0 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Testar o merge candidato contra a base efetiva
        run: |
          python tools/sc_semantic_v2_ui/build.py
          python tools/sc_semantic_v2_ui/qa.py
          git diff --exit-code -- index.html assets/pauta-filters-v2.js assets/sc-federais-filters-v2-data.js data/sc-semantic-v2-ui/payload.json data/sc-semantic-v2-ui/manifest.json
      - name: Provas do merge candidato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-semantic-v2-ui-merge
          path: |
            data/sc-semantic-v2-ui/qa.json
            data/sc-semantic-v2-ui/unit-tests.txt
            /tmp/sc-v2-ui-shots/
          retention-days: 14
  verify-published:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verificar bytes e interação no site público
        run: python tools/sc_semantic_v2_ui/verify_live.py
      - name: Prova da publicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-semantic-v2-ui-live
          path: /tmp/sc-semantic-v2-ui-live/
          retention-days: 14
