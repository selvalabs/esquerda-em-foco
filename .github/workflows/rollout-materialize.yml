name: GLOBAL-04D4 reviewed rollout finalization
on:
  push:
    branches: [feat/global-04d4-rollout]
    paths: ['.github/workflows/rollout-materialize.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: |
          pip install beautifulsoup4==4.14.3 jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Apply reviewed source corrections and regenerate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/global-04d4-rollout'
          mkdir -p "$RUNNER_TEMP/rollout-review"
          python tools/global_rollout/finalize.py
          python tools/global_rollout/build.py | tee "$RUNNER_TEMP/rollout-review/build.json"
          python tools/global03/publication.py --prepare
          git config user.name 'Selva Labs'
          git config user.email '174397880+selvalabs@users.noreply.github.com'
          git add -- tools/global_rollout/projection.py tools/global_rollout/build.py assets/global/rollout.js tests/global_rollout/verify.py tools/sp/publication/verify_live.py tools/sc_semantic_v2_ui/verify_live.py data/global-integration/migration-status.json data/global-rollout config/editions.json data/global03/publication-files.json sc/deputados-federais/index.html sc/deputados-estaduais/index.html rs/deputados-federais/index.html pr/deputados-federais/index.html pr/deputados-estaduais/index.html sp/deputados-federais/index.html
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(rollout): preservar objeto revisado e atualizar compatibilidade SC/SP #56'
            git push origin HEAD:feat/global-04d4-rollout
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/rollout-review/executed-commit.txt"
      - name: Legacy queries, source precision and all SP portraits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/rollout-review/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python tests/global_rollout/legacy_browser.py --base http://127.0.0.1:8765/ --out "$RUNNER_TEMP/rollout-review/legacy" 2>&1 | tee "$RUNNER_TEMP/rollout-review/legacy.log"
      - name: Record reviewed changes and repository cleanliness
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rollout-review"
          git status --porcelain > "$RUNNER_TEMP/rollout-review/status.txt"
          git diff 51eb9195d836b984e73f05a845cf414ac1798e35 --stat > "$RUNNER_TEMP/rollout-review/diff-stat.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-04D4-source-review
          path: ${{ runner.temp }}/rollout-review
          retention-days: 30
