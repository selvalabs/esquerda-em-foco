name: SP federal Round B audit
on:
  push:
    branches: [feat/sp-federais-round-b]
    paths:
      - tools/sp/round_b_audit.py
      - .github/workflows/sp-round-b-audit.yml
      - data/sp/research/batch-*.json
      - data/shared/pautas-taxonomy-v1.json
permissions:
  contents: write
concurrency:
  group: sp-federal-round-b-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sp-federais-round-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and consolidate
        run: python tools/sp/round_b_audit.py
      - name: Validate generated outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/sp/ROUND-B-AUDIT.json').read_text())
          r=json.loads(Path('data/sp/research/records.json').read_text())
          t=json.loads(Path('data/sp/research/theme-evidence-2026.json').read_text())
          assert a['gate']=='PASS'
          assert a['population']==a['reviewed_candidates']==a['unique_candidates']==234
          assert not a['problems']
          assert r['candidate_count']==234==len(r['records'])
          assert len({x['candidate_id'] for x in r['records']})==234
          assert t['filters_implemented'] is False
          assert t['candidate_count']==a['candidates_with_2026_claim']
          for x in t['records']:
              assert x['themes']
              for theme in x['themes']:
                  assert theme['claim_ids'] and theme['source_ids'] and theme['sources']
          print('Round B audit validation: PASS')
          PY
      - name: Protect non-SP product files
        run: |
          python - <<'PY'
          import subprocess
          base=subprocess.check_output(['git','merge-base','HEAD','origin/feat/sp-federais-round-a'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed=('data/sp/','docs/sp/','tools/sp/','data/shared/','.github/workflows/sp-round-b')
          bad=[p for p in paths if not p.startswith(allowed)]
          assert not bad,bad
          print('Allowed path isolation: PASS')
          PY
      - name: Commit audit outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sp/research/records.json data/sp/research/theme-evidence-2026.json docs/sp/ROUND-B-AUDIT.json docs/sp/ROUND-B.md
          if ! git diff --cached --quiet; then
            git commit -m 'data(sp): consolidate and pass Round B evidence audit [skip ci]'
            git push origin HEAD:refs/heads/feat/sp-federais-round-b
          fi
