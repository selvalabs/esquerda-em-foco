name: RS FED03 published verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rs-fed03-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d6ee6952ba4b85cee189d297c886f5e13003872
          fetch-depth: 0
      - name: Verify actual merge and served bytes
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,subprocess,time,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          commit='4d6ee6952ba4b85cee189d297c886f5e13003872'
          parent=subprocess.check_output(['git','rev-parse',commit+'^1'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only',parent,commit],text=True).splitlines()
          allowed=('data/rs/','docs/rs/','tools/rs/','tests/rs/','rs/deputados-federais/','.github/workflows/rs-fed03-')
          unexpected=[p for p in changed if not p.startswith(allowed)]
          assert not unexpected,unexpected
          before=subprocess.check_output(['git','show',parent+':index.html'])
          assert before==Path('index.html').read_bytes(),'SC changed in this merge'
          report={'checked_at':datetime.now(timezone.utc).isoformat(),'implementation_commit':commit,'parent_commit':parent,'unexpected_changes':unexpected,'sc_preserved':True,'base_url':'https://selvalabs.github.io/esquerda-em-foco/','files':[],'errors':[]}
          pairs=[('','index.html'),('deputados-estaduais/','deputados-estaduais/index.html'),('sitemap.xml','sitemap.xml'),('robots.txt','robots.txt')]
          pairs += [('rs/deputados-federais/' if p.name=='index.html' else p.as_posix(),p.as_posix()) for p in sorted(Path('rs/deputados-federais').rglob('*')) if p.is_file()]
          def verify(pair):
              route,path=pair;expected=hashlib.sha256(Path(path).read_bytes()).hexdigest();last=''
              for attempt in range(7):
                  try:
                      req=urllib.request.Request(report['base_url']+route+'?rsfed03='+commit[:12],headers={'User-Agent':'EsquerdaEmFoco-publication-audit','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as r:raw=r.read();status=r.status
                      actual=hashlib.sha256(raw).hexdigest()
                      if status!=200 or actual!=expected:raise ValueError(f'HTTP/hash mismatch: {status}, {actual}')
                      return {'path':path,'url':report['base_url']+route,'status':status,'bytes':len(raw),'expected_sha256':expected,'actual_sha256':actual,'passed':True}
                  except Exception as exc:last=str(exc);time.sleep(3*(attempt+1))
              return {'path':path,'passed':False,'error':last}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:report['files']=list(pool.map(verify,pairs))
          report['errors']=[r for r in report['files'] if not r['passed']];report['files_checked']=len(report['files']);report['passed']=not report['errors']
          Path('rs-fed03-live-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='files'},ensure_ascii=False,indent=2))
          if not report['passed']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-fed03-live-verification
          path: rs-fed03-live-verification.json
          retention-days: 14
