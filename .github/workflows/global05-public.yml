name: GLOBAL-05 published QA
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '404.html'
      - 'index.html'
      - 'deputados-estaduais/index.html'
      - 'assets/global/navigation.css'
      - 'assets/global/rollout.js'
      - 'data/global03/publication-files.json'
      - 'docs/GLOBAL-INTEGRATION-*.md'
      - 'pr/**'
      - 'rs/**'
      - 'sc/**'
      - 'sp/**'
      - 'tests/global05/**'
      - 'tools/global05/**'
      - 'tools/global03/publication.py'
      - '.github/workflows/global05-public.yml'
permissions:
  contents: read
concurrency:
  group: global05-public
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SITE: https://selvalabs.github.io/esquerda-em-foco/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser and verification dependencies
        run: |
          pip install beautifulsoup4==4.14.3 jsonschema==4.25.1 playwright==1.63.0 lxml==6.0.1 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Wait for Pages and verify every manifest byte plus real 404
        run: |
          mkdir -p "$RUNNER_TEMP/global05-public"
          git rev-parse HEAD > "$RUNNER_TEMP/global05-public/executed-commit.txt"
          python tools/global03/publication.py --out "$RUNNER_TEMP/global05-public/http"
      - name: Targeted GLOBAL-05 behavior on the published site
        run: python tests/global05/browser.py --base-url "$SITE" --out "$RUNNER_TEMP/global05-public/targeted"
      - name: Broad published rollout and Selected regressions
        run: |
          python tests/global_rollout/browser.py --live-base "$SITE" --out "$RUNNER_TEMP/global05-public/rollout"
          python tests/global04/validate.py --live-base "$SITE" --out "$RUNNER_TEMP/global05-public/collections"
          python tests/global04/edge_cases.py --live-base "$SITE" --out "$RUNNER_TEMP/global05-public/collection-edges"
      - name: Existing SC and SP public compatibility gates
        run: |
          python tools/sp/publication/verify_live.py
          python tools/sc_semantic_v2_ui/verify_live.py
          mkdir -p "$RUNNER_TEMP/global05-public/legacy-verifiers"
          cp -a /tmp/sp-publication-live "$RUNNER_TEMP/global05-public/legacy-verifiers/" 2>/dev/null || true
          cp -a /tmp/sc-semantic-v2-ui-live "$RUNNER_TEMP/global05-public/legacy-verifiers/" 2>/dev/null || true
      - name: Published metadata spot checks
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from bs4 import BeautifulSoup
          import json,os
          from pathlib import Path
          base=os.environ['SITE']; paths=['','sc/','rs/','pr/','sp/','sc/deputados-federais/','sc/deputados-estaduais/','rs/deputados-federais/','pr/deputados-federais/','pr/deputados-estaduais/','sp/deputados-federais/']
          rows=[]
          for p in paths:
              with urlopen(Request(base+p,headers={'Cache-Control':'no-cache','User-Agent':'EEF-GLOBAL05'}),timeout=30) as r: raw=r.read();code=r.status
              d=BeautifulSoup(raw,'html.parser'); rows.append({'path':p or '/','status':code,'title':d.title.get_text(strip=True) if d.title else None,'canonical':d.select_one('link[rel=canonical]')['href'],'og_image':d.select_one('meta[property="og:image"]')['content']})
          out=Path(os.environ['RUNNER_TEMP'])/'global05-public/metadata.json';out.write_text(json.dumps({'passed':all(r['status']==200 and r['title'] and r['canonical'] and r['og_image'] for r in rows),'pages':rows},ensure_ascii=False,indent=2)+'\n')
          assert all(r['status']==200 and r['title'] and r['canonical'] and r['og_image'] for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-05-public-QA
          path: ${{ runner.temp }}/global05-public
          retention-days: 30
          include-hidden-files: true
