name: RS estaduais — AD3 source reading
on:
  push:
    branches: [feat/rs-deputados-estaduais]
    paths: ['.github/workflows/rs-estaduais-ad3-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rs-estaduais-ad3-source-reading
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/feat/rs-deputados-estaduais'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-deputados-estaduais
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/rs-estaduais/ad3_follow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-estaduais-ad3-follow
          retention-days: 1
          path: /tmp/rs-ad3-follow/
