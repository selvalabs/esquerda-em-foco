name: RS editorial source review
on:
  push:
    branches: [feat/deputados-federais-rs]
    paths: ['tools/rs/research.py', '.github/workflows/rs-research.yml']
permissions:
  contents: read
concurrency:
  group: rs-editorial-review
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python tools/rs/research.py
      - uses: actions/upload-artifact@v4
        with:
          name: rs-editorial-sources
          retention-days: 3
          path: review-rs/
