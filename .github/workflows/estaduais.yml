name: Estaduais — coleta e validação isolada
on:
  push:
    branches: [feat/deputados-estaduais-sc]
    paths:
      - deputados-estaduais/tools/**
      - deputados-estaduais/editorial/**
      - deputados-estaduais/template/**
      - .github/workflows/estaduais.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: estaduais-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/deputados-estaduais-sc'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deputados-estaduais-sc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install beautifulsoup4 pillow playwright
      - name: Collect official public records
        run: python deputados-estaduais/tools/collect.py
      - name: Build isolated application
        run: python deputados-estaduais/tools/build.py
      - name: Browser regression tests
        run: |
          python -m playwright install --with-deps chromium
          python deputados-estaduais/tools/qa.py
      - name: Save only state-deputy outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deputados-estaduais/
          if ! git diff --cached --quiet; then
            git commit -m 'data(estaduais): official snapshot and isolated verification [skip ci]'
            git pull --rebase origin feat/deputados-estaduais-sc
            git push origin HEAD:feat/deputados-estaduais-sc
          fi
      - name: Review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estaduais-review
          path: deputados-estaduais/
          retention-days: 7
