name: Issue 19 — canonical scope reconciliation
on:
  push:
    branches: [fix/issue-19-canonical-missing-records]
    paths:
      - 'tools/pr/**'
      - 'tests/pr/**'
      - 'tools/rs/**'
      - 'tests/rs/**'
      - '.github/workflows/issue-19-main.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue-19-main
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-19-canonical-missing-records
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install beautifulsoup4==4.13.4 lxml==6.1.3 pillow==12.3.0 playwright==1.63.0
      - name: Rebuild Paraná from canonical scope
        run: |
          python tools/pr/collect.py
          python tools/pr/enrich.py
          python tools/pr/privacy.py
          python tools/pr/build.py
          python -m unittest discover -s tests/pr -p 'test_*.py' -v
      - name: Rebuild RS federal from canonical scope
        run: |
          python tools/rs/bootstrap.py
          python tools/rs/enrich.py
          python tools/rs/details.py
          python tools/rs/votes_ranges.py
          python tools/rs/editorial_institutional.py
          python tools/rs/review_log.py
          python tools/rs/build.py
          python tools/rs/finalize.py
          python -m unittest discover -s tests/rs -p 'test_*.py' -v
      - name: Browser QA
        run: |
          python -m playwright install --with-deps chromium
          python tools/pr/qa.py
          python tools/rs/qa.py
      - name: Scope regression audit
        run: |
          git fetch origin feat/rs-deputados-estaduais:refs/remotes/origin/feat/rs-deputados-estaduais
          python tools/scope/audit.py
      - name: Commit generated public outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pr docs/pr pr data/rs docs/rs rs docs/methodology/party-scope-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(issue-19): regenerate PR and RS federal canonical scope'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-main-review
          retention-days: 7
          path: |
            data/pr/
            docs/pr/
            pr/
            data/rs/
            docs/rs/
            rs/deputados-federais/
            docs/methodology/party-scope-audit.json
