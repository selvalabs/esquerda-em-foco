name: RS editorial release validation
on:
  push:
    branches: [feat/rs-federais-revisao-editorial]
    paths: ['tools/rs/review_support.py', 'tools/rs/upgrade_review.py', 'tools/rs/review-runtime.js', 'data/rs/review-editorial.json', 'tests/rs/test_review.py', '.github/workflows/rs-editorial-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rs-editorial-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EEFOCO_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-federais-revisao-editorial
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4 Pillow==11.3.0 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Install reviewed renderer and build offline
        run: |
          python tools/rs/upgrade_review.py
          python tools/rs/build.py
      - name: Validate sources, votes, topics and privacy
        run: |
          set -o pipefail
          python -m unittest discover -s tests/rs -p 'test_*.py' -v 2>&1 | tee docs/rs/review/unit-tests.txt
      - name: Browser regression at seven widths
        run: python tools/rs/qa.py
      - name: Verify deterministic rebuild
        run: |
          sha256sum rs/deputados-federais/index.html rs/deputados-federais/dados.json > /tmp/rs-before.sha256
          python tools/rs/build.py
          sha256sum -c /tmp/rs-before.sha256
      - name: Preserve other editions and commit validated outputs
        run: |
          git diff --exit-code 810a7896b3355254d50852761a41bae31ce3f567 -- index.html deputados-estaduais sitemap.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rs docs/rs rs/deputados-federais tools/rs tests/rs
          if ! git diff --cached --quiet; then
            git commit -m 'build(rs): validated editorial revision and documented remaining gaps'
            git pull --rebase origin feat/rs-federais-revisao-editorial
            git push origin HEAD:feat/rs-federais-revisao-editorial
          fi
      - name: Package evidence and reproducible RS sources
        if: always()
        run: |
          mkdir -p /tmp/rs-review-artifact
          tar -czf /tmp/rs-review-artifact/rs-review-source.tar.gz tools/rs tests/rs data/rs docs/rs rs/deputados-federais index.html favicon.svg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-editorial-review
          path: /tmp/rs-review-artifact/
          retention-days: 14
