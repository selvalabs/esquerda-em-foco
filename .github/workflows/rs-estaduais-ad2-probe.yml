name: RS estaduais — A-D.2 source inspection
on:
  push:
    branches: [feat/rs-deputados-estaduais]
    paths: ['tools/rs-estaduais/ad2_probe.py', '.github/workflows/rs-estaduais-ad2-probe.yml']
permissions:
  contents: read
concurrency:
  group: rs-estaduais-ad2-probe
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feat/rs-deputados-estaduais'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-deputados-estaduais
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python tools/rs-estaduais/ad2_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-estaduais-ad2-probe
          retention-days: 1
          path: /tmp/rs-ad2-probe/
