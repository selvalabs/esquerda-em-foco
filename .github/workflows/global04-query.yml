name: GLOBAL-04 lot02 common query
on:
  push:
    branches: [feat/global-04-query]
permissions:
  contents: write
concurrency:
  group: global04-lot02
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EEFOCO_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          pip install beautifulsoup4==4.13.4 playwright==1.55.0 lxml==6.0.1 Pillow==11.3.0 jsonschema==4.25.1
          python -m playwright install --with-deps chromium
      - name: Prepare reviewed runtime corrections and generated layers
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/global04-query-results" "$RUNNER_TEMP/global04-query-baseline"
          git archive 1a71c03987f52104af12af42eebda52449ff5570 | tar -x -C "$RUNNER_TEMP/global04-query-baseline"
          python tools/global04/finalize_query.py
          python tools/global04/query_build.py
          python tools/global03/publication.py --prepare
          git config user.name 'Selva Labs'
          git config user.email '174397880+selvalabs@users.noreply.github.com'
          git add assets/global/core.js assets/global/query.css assets/pauta-filters-editorial.js deputados-estaduais/ui/app.js deputados-estaduais/assets/app.js tools/rs/runtime.js tools/pr/runtime.js pr/assets/runtime.js sp/deputados-federais/assets/app.js tools/global04/query_build.py tests/global04/query_validate.py sc/deputados-federais/index.html sc/deputados-estaduais/index.html rs/deputados-federais/index.html pr/deputados-federais/index.html pr/deputados-estaduais/index.html sp/deputados-federais/index.html config/editions.json data/global03/publication-files.json data/global-integration/migration-status.json data/global04/lot02.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(global04): finalizar histórico em memória e contratos do lote 02 #43'
            git push origin HEAD:feat/global-04-query
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/global04-query-results/executed-commit.txt"
      - name: Pure contracts and existing regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --test tests/global04/query.test.cjs tests/global04/selection.test.cjs tests/global02/core.test.cjs tests/sc_editorial_selected.test.cjs tests/sc_federais_filters.test.cjs tests/sc_semantic_v2_ui.test.cjs tests/sp/round_c/test_filters.cjs | tee "$RUNNER_TEMP/global04-query-results/unit.txt"
      - name: Preservation and browser query integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global04/query_validate.py --baseline-root "$RUNNER_TEMP/global04-query-baseline" --out "$RUNNER_TEMP/global04-query-results/query" 2>&1 | tee "$RUNNER_TEMP/global04-query-results/query.log"
      - name: Collections under shared query
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global04/validate.py --out "$RUNNER_TEMP/global04-query-results/collections" 2>&1 | tee "$RUNNER_TEMP/global04-query-results/collections.log"
      - name: Legacy renderers and refresh
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global03/rebuild.py --out "$RUNNER_TEMP/global04-query-results/rebuild" 2>&1 | tee "$RUNNER_TEMP/global04-query-results/rebuild.log"
      - name: Deterministic second generation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tools/global04/finalize_query.py
          python tools/global04/query_build.py
          python tools/global03/publication.py --prepare
          git diff --exit-code
          test -z "$(git status --porcelain)"
          printf 'passed\n' > "$RUNNER_TEMP/global04-query-results/clean-tree.txt"
      - name: Package evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/global04-query-results/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/global04-query-results/source"
          rm -rf "$RUNNER_TEMP/global04-query-results/query/webroot" "$RUNNER_TEMP/global04-query-results/collections/webroot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-04-lot02
          path: ${{ runner.temp }}/global04-query-results
          retention-days: 30
          include-hidden-files: true
