name: GLOBAL-04 lot02 common query
on:
  push:
    branches: [feat/global-04-query]
permissions:
  contents: write
concurrency:
  group: global04-lot02
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EEFOCO_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          pip install beautifulsoup4==4.13.4 playwright==1.55.0 lxml==6.0.1 Pillow==11.3.0 jsonschema==4.25.1
          python -m playwright install --with-deps chromium
      - name: Materialize L02 source and generated outputs
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/global04-query-results" "$RUNNER_TEMP/global04-query-baseline"
          git archive 1a71c03987f52104af12af42eebda52449ff5570 | tar -x -C "$RUNNER_TEMP/global04-query-baseline"
          if test -f tools/global04/lot02-payload.00a.b64; then
            cat               tools/global04/lot02-payload.00a.b64               tools/global04/lot02-payload.00b.b64               tools/global04/lot02-payload.00c.b64               tools/global04/lot02-payload.01.b64               tools/global04/lot02-payload.02.b64               tools/global04/lot02-payload.03a.b64               tools/global04/lot02-payload.03b.b64               tools/global04/lot02-payload.03c.b64               | base64 -d | tar -xz
            rm tools/global04/lot02-payload.*.b64
            # Workflow files are versioned with the connector, not by GITHUB_TOKEN.
            rm -f .github/workflows/global04-query-publication.yml
            python tools/global04/query_build.py
            python tools/global03/publication.py --prepare
            git config user.name 'Selva Labs'
            git config user.email '174397880+selvalabs@users.noreply.github.com'
            git add -A
            git commit -m 'feat(global04): materializar consulta comum do lote 02 #43'
            git push origin HEAD:feat/global-04-query
          else
            python tools/global04/query_build.py
            python tools/global03/publication.py --prepare
            git diff --exit-code
            test -z "$(git status --porcelain)"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/global04-query-results/executed-commit.txt"
      - name: Pure query contracts and existing regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --test tests/global04/query.test.cjs tests/global04/selection.test.cjs tests/global02/core.test.cjs tests/sc_editorial_selected.test.cjs tests/sc_federais_filters.test.cjs tests/sc_semantic_v2_ui.test.cjs tests/sp/round_c/test_filters.cjs | tee "$RUNNER_TEMP/global04-query-results/unit.txt"
      - name: Preservation and browser query integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global04/query_validate.py --baseline-root "$RUNNER_TEMP/global04-query-baseline" --out "$RUNNER_TEMP/global04-query-results/query" | tee "$RUNNER_TEMP/global04-query-results/query.log"
      - name: Recheck collection layer under shared query
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global04/validate.py --out "$RUNNER_TEMP/global04-query-results/collections" | tee "$RUNNER_TEMP/global04-query-results/collections.log"
      - name: Legacy renderer refresh restores collection and query layers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global03/rebuild.py --out "$RUNNER_TEMP/global04-query-results/rebuild" | tee "$RUNNER_TEMP/global04-query-results/rebuild.log"
      - name: Deterministic second generation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tools/global04/query_build.py
          python tools/global03/publication.py --prepare
          git diff --exit-code
          test -z "$(git status --porcelain)"
          printf 'passed\n' > "$RUNNER_TEMP/global04-query-results/clean-tree.txt"
      - name: Package evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/global04-query-results/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/global04-query-results/source"
          rm -rf "$RUNNER_TEMP/global04-query-results/query/webroot" "$RUNNER_TEMP/global04-query-results/collections/webroot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-04-lot02
          path: ${{ runner.temp }}/global04-query-results
          retention-days: 30
          include-hidden-files: true
