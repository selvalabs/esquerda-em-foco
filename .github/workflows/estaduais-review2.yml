name: Estaduais SC — Revisão 2
on:
  push:
    branches: [feat/estaduais-sc-review-2]
    paths:
      - deputados-estaduais/review2-run.json
      - .github/workflows/estaduais-review2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: estaduais-review2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/feat/estaduais-sc-review-2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/estaduais-sc-review-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pillow playwright
      - name: Run requested stage
        run: |
          MODE=$(python -c "import json; print(json.load(open('deputados-estaduais/review2-run.json'))['mode'])")
          if [ "$MODE" = collect ]; then
            python deputados-estaduais/tools/review2_collect.py
            python deputados-estaduais/tools/review2_votes.py
          elif [ "$MODE" = votes ]; then
            python deputados-estaduais/tools/review2_votes.py
          elif [ "$MODE" = sources ]; then
            python deputados-estaduais/tools/review2_sources.py
          elif [ "$MODE" = build ]; then
            python -m playwright install --with-deps chromium
            python deputados-estaduais/tools/review2_build.py
            python deputados-estaduais/tools/qa.py
            python deputados-estaduais/tools/review2_qa.py
          else
            echo 'Unknown stage; refusing execution'; exit 1
          fi
      - name: Verify write isolation and commit review outputs
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          bad = [p for p in changed if not p.startswith('deputados-estaduais/')]
          assert not bad, f'Out-of-scope changes: {bad}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deputados-estaduais/
          if ! git diff --cached --quiet; then
            git commit -m 'build(estaduais): review-2 audited outputs [skip ci]'
            git push origin HEAD:feat/estaduais-sc-review-2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estaduais-review2-${{ github.run_number }}-${{ github.run_attempt }}
          path: deputados-estaduais/
          retention-days: 7
