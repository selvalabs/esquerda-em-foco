name: RS FED03 source reading
on:
  push:
    branches: [feat/rs-federais-fechamento-editorial]
    paths: ['tools/rs/fed03_sources.py', '.github/workflows/rs-fed03-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rs-fed03-sources
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-federais-fechamento-editorial
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python tools/rs/fed03_sources.py
      - name: Record availability only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rs/fed03/source-availability.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(rs): dated public source availability, without copying full articles'
            git pull --rebase origin feat/rs-federais-fechamento-editorial
            git push origin HEAD:feat/rs-federais-fechamento-editorial
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-fed03-source-reading
          path: /tmp/rs-fed03-source-reading.json
          retention-days: 3
