name: PR — isolated official base
on:
  push:
    branches: [feat/parana-base-2026]
    paths: ['tools/pr/**', 'tests/pr/**', 'data/pr/editorial.json', '.github/workflows/pr-base.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr-base-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/parana-base-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/parana-base-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install beautifulsoup4==4.13.4 lxml==6.1.3 pillow==12.3.0 playwright==1.63.0
      - name: Official census and public source snapshots
        run: |
          python tools/pr/collect.py
          if [ -f tools/pr/enrich.py ]; then python tools/pr/enrich.py; fi
      - name: Render both Paraná editions
        run: |
          if [ -f tools/pr/build.py ]; then python tools/pr/build.py; fi
      - name: Validate
        run: |
          if [ -f tests/pr/test_base.py ]; then python -m unittest discover -s tests/pr -p 'test_*.py' -v; fi
          if [ -f tools/pr/qa.py ]; then python -m playwright install --with-deps chromium; python tools/pr/qa.py; fi
      - name: Commit only Paraná outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pr docs/pr pr
          if ! git diff --cached --quiet; then
            git diff --cached --name-only | grep -vE '^(data/pr/|docs/pr/|pr/)' > /tmp/pr-unexpected || true
            test ! -s /tmp/pr-unexpected
            git commit -m 'build(pr): generated official census and validated isolated editions'
            git pull --rebase origin feat/parana-base-2026
            git push origin HEAD:feat/parana-base-2026
          fi
      - name: Export reproducible review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parana-review
          retention-days: 7
          path: |
            pr/
            data/pr/
            docs/pr/
            tools/pr/
            tests/pr/
            tools/rs/build.py
            tools/rs/runtime.js
            tools/rs/votes_ranges.py
            rs/deputados-federais/index.html
            index.html
            favicon.svg
            assets/
            site.webmanifest
