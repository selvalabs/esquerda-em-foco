name: RS estaduais — source inspection
on:
  push:
    branches: [feat/rs-deputados-estaduais]
    paths:
      - 'tools/rs-estaduais/inspect_sources.py'
      - '.github/workflows/rs-estaduais-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rs-estaduais-source-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feat/rs-deputados-estaduais'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-deputados-estaduais
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/rs-estaduais/inspect_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-state-source-inspection
          retention-days: 1
          path: /tmp/rs-state-source-review/
