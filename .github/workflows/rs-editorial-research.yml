name: RS round-two source review
on:
  push:
    branches: [feat/rs-federais-revisao-editorial]
    paths: ['tools/rs/review_collect.py', 'tools/rs/review_votes.py', '.github/workflows/rs-editorial-research.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rs-round-two-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-federais-revisao-editorial
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Recheck official sources
        run: |
          if [ ! -f docs/rs/review/official-refresh.json ]; then python tools/rs/review_collect.py; fi
          if [ -f tools/rs/review_votes.py ]; then python tools/rs/review_votes.py; fi
      - name: Commit only RS research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rs docs/rs/review
          if ! git diff --cached --quiet; then
            git commit -m 'data(rs): round-two official refresh and candidate audit'
            git pull --rebase origin feat/rs-federais-revisao-editorial
            git push origin HEAD:feat/rs-federais-revisao-editorial
          fi
