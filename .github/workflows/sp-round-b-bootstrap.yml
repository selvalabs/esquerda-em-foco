name: SP federal Round B bootstrap
on:
  push:
    branches: [feat/sp-federais-round-b]
    paths:
      - tools/sp/round_b_bootstrap.py
      - .github/workflows/sp-round-b-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: sp-federal-round-b-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sp-federais-round-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public official bootstrap
        run: python tools/sp/round_b_bootstrap.py
      - name: Validate queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('data/sp/round-b-research-queue.json').read_text())
          m=json.loads(Path('docs/sp/ROUND-B-BOOTSTRAP.json').read_text())
          assert len(q)==234==len({x['candidate_id'] for x in q})
          assert m['queue_count']==234
          assert all(x['research_state']=='pending_individual_review' for x in q)
          assert all('pautas' not in x and 'theme_ids' not in x for x in q)
          print('Round B bootstrap validation: PASS')
          PY
      - name: Commit bootstrap evidence
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/sp-federais-round-b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sp/round-b-*.json docs/sp/ROUND-B-BOOTSTRAP.json docs/sp/sp-history-schema.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(sp): collect Round B public research bootstrap [skip ci]'
            git push origin HEAD:refs/heads/feat/sp-federais-round-b
          fi
