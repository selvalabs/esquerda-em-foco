name: GLOBAL-03 verify public home
on:
  push:
    branches: [main]
    paths:
      - 'data/global03/publication-files.json'
      - '.github/workflows/global03-publication.yml'
permissions:
  contents: read
concurrency:
  group: global03-public-home
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.4 playwright==1.55.0 lxml==6.0.1
          python -m playwright install --with-deps chromium
      - name: Verify public bytes and real 404
        run: python tools/global03/publication.py --out "$RUNNER_TEMP/global03-public"
      - name: Test published navigation and shared collection
        run: python tests/global03/validate.py --live-base https://selvalabs.github.io/esquerda-em-foco/ --out "$RUNNER_TEMP/global03-public/browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-03-public-verification
          path: ${{ runner.temp }}/global03-public
          retention-days: 30
