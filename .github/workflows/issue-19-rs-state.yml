name: Issue 19 — RS estaduais canonical scope
on:
  push:
    branches: [fix/issue-19-rs-estaduais-scope]
    paths:
      - 'config/party-scope-2026.json'
      - 'tools/rs-estaduais/**'
      - 'tests/rs-estaduais/**'
      - '.github/workflows/issue-19-rs-state.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue-19-rs-state
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-19-rs-estaduais-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install beautifulsoup4==4.13.4 lxml==6.1.3 pillow==12.3.0 playwright==1.63.0
      - name: Recollect canonical RS state-deputy population
        run: |
          python -m compileall -q tools/rs-estaduais
          python tools/rs-estaduais/collect.py
          python tools/rs-estaduais/research.py
          python tools/rs-estaduais/votes.py
          python tools/rs-estaduais/phase2_votes.py
          python tools/rs-estaduais/finalize_sources.py
          python tools/rs-estaduais/phase2_apply.py
          python tools/rs-estaduais/build.py
      - name: Data and browser validation
        run: |
          set -o pipefail
          python -m unittest discover -s tests/rs-estaduais -p 'test_*.py' -v 2>&1 | tee docs/rs-estaduais/unit-tests.txt
          python -m playwright install --with-deps chromium
          python tools/rs-estaduais/qa.py
          python tools/rs-estaduais/report.py
          python tools/rs-estaduais/phase2_report.py
      - name: Preserve unrelated editions and commit generated outputs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          baseline=json.loads(Path('docs/rs-estaduais/baseline.json').read_text())
          for path in baseline['protected_git_objects']:
              subprocess.run(['git','diff','--exit-code',baseline['commit'],'--',path],check=True)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed=('data/rs-estaduais/','docs/rs-estaduais/','rs/deputados-estaduais/')
          assert all(p.startswith(allowed) for p in changed), changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rs-estaduais docs/rs-estaduais rs/deputados-estaduais
          if ! git diff --cached --quiet; then
            git commit -m 'build(issue-19): regenerate RS estaduais canonical scope'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-rs-estaduais-review
          retention-days: 7
          path: |
            data/rs-estaduais/
            docs/rs-estaduais/
            rs/deputados-estaduais/
