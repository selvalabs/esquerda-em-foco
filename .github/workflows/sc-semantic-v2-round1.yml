name: SC — auditoria semântica v2 Round 1
on:
  push:
    branches: [feat/sc-federais-semantica-v2-round1]
    paths:
      - .github/workflows/sc-semantic-v2-round1.yml
      - tools/sc_semantic_v2/**
      - data/sc-semantic-v2/inputs/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc-semantic-v2-round1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exportar insumos pinados para revisão
        run: |
          mkdir -p /tmp/sc-semantic-inputs
          git archive --format=zip --output=/tmp/sc-semantic-inputs/baseline.zip 32175f20f594f48bf101144809fb9d39d71c94a6 index.html config/topics-v1.json data/sc-federais-pautas data/sc-federais-topics-v1 data/sc-federais-filters-v1 assets/pauta-filters.js assets/pauta-filters.css tools/sc_federal_taxonomy docs/TOPICS-V1-CONTRACT.md docs/SC-FEDERAIS-FILTERS-V1.md
          git ls-tree -r 32175f20f594f48bf101144809fb9d39d71c94a6 > /tmp/sc-semantic-inputs/baseline-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sc-semantic-v2-inputs
          path: /tmp/sc-semantic-inputs/
          retention-days: 7
