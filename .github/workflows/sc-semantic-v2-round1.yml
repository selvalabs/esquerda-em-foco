name: SC — auditoria semântica v2 Round 1
on:
  push:
    branches: [feat/sc-federais-semantica-v2-round1]
    paths: [.github/workflows/sc-semantic-v2-round1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc-semantic-v2-round1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Ler fontes públicas não extraídas
        run: python tools/sc_semantic_v2/capture_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-semantic-v2-rendered
          path: /tmp/sc-semantic-inputs/
          retention-days: 7
