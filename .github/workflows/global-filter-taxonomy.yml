name: GLOBAL-04D1 taxonomy contract
on:
  push:
    branches: [feat/global-04d1-taxonomy, main]
    paths: ['tools/global_filters/**','tests/global_filters/**','config/global-filter-taxonomy*','data/global-integration/filter-*','docs/GLOBAL-FILTER-*','.github/workflows/global-filter-taxonomy.yml']
  pull_request:
    paths: ['tools/global_filters/**','tests/global_filters/**','config/global-filter-taxonomy*','data/global-integration/filter-*','docs/GLOBAL-FILTER-*','.github/workflows/global-filter-taxonomy.yml']
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name == 'push' || github.head_ref == 'feat/global-04d1-taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4==4.13.4 jsonschema==4.25.1
      - name: Deterministic contracts, without rewriting sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d1-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/d1-evidence/executed-commit.txt"
          python tools/global_filters/build.py --check
          python tools/global_filters/schema.py --check
          python tools/global_filters/check_expected.py
      - name: Semantic tests and real source locators
        run: |
          set -o pipefail
          python -m unittest discover -s tests/global_filters -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/d1-evidence/semantic-tests.txt"
      - name: Existing query and collection regressions
        run: |
          set -o pipefail
          node --test tests/global04/query.test.cjs tests/global04/selection.test.cjs tests/global02/core.test.cjs tests/sc_editorial_selected.test.cjs tests/sc_federais_filters.test.cjs tests/sc_semantic_v2_ui.test.cjs tests/sp/round_c/test_filters.cjs | tee "$RUNNER_TEMP/d1-evidence/existing-tests.txt"
      - name: Real baseline preservation and clean tree
        run: python tools/global_filters/verify_preservation.py --out "$RUNNER_TEMP/d1-evidence/preservation.json"
      - name: Package D1 contracts only, no public-data duplicate or fonts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/d1-evidence/source"
          git archive HEAD tools/global_filters tests/global_filters config/global-filter-taxonomy.json config/global-filter-taxonomy.schema.json data/global-integration/filter-crosswalk.json data/global-integration/filter-capabilities.json data/global-integration/filter-inputs.json docs/GLOBAL-FILTER-TAXONOMY.md docs/GLOBAL-FILTER-CROSSWALK.md .github/workflows/global-filter-taxonomy.yml | tar -x -C "$RUNNER_TEMP/d1-evidence/source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-04D1-contracts
          path: ${{ runner.temp }}/d1-evidence
          retention-days: 30
          include-hidden-files: true
