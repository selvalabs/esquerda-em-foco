name: D5 one-shot metadata preparation
on:
  push:
    branches: [feat/global-04d5-reconciliation]
    paths: ['.github/workflows/reconciliation-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.14.3 jsonschema==4.25.1
      - name: Apply reviewed test compatibility and remove unused transport
        run: |
          test "$GITHUB_REF" = refs/heads/feat/global-04d5-reconciliation
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('tests/global_rollout/verify.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='6097aceebc16bea8e03b0f9f991e47907005e72b'
          s=p.read_text()
          old=" newstatus=load(ROOT/'data/global-integration/migration-status.json');newstatus.pop('canonical_rollout')\n"
          assert s.count(old)==1
          extra=" if 'reconciliation' in newstatus:\n  closing=newstatus.pop('reconciliation')\n  check('D5 closure identity',closing.get('issue')==57 and closing.get('baseline')=='8a36b2a47a893746ea528646ff0bb40d6a2d9101' and closing.get('global05_completed') is False)\n  check('D5 preserves previous flag',closing.get('previous_whole_issue_completed') is False)\n  subprocess.run([sys.executable,str(ROOT/'tools/global_reconciliation/reconcile.py'),'--check'],check=True)\n  newstatus['whole_issue_completed']=closing['previous_whole_issue_completed']\n"
          p.write_text(s.replace(old,old+extra))
          # The abandoned transport is never decoded or executed. Sources above are plain UTF-8.
          Path('tools/global_reconciliation/source.b64').unlink(missing_ok=True)
          PY
      - name: Generate operational metadata and verify exact preservation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d5-preparation"
          python tools/global_reconciliation/reconcile.py --build
          python -m unittest discover -s tests/global_reconciliation -v 2>&1 | tee "$RUNNER_TEMP/d5-preparation/tests.txt"
          git config user.name 'Selva Labs'
          git config user.email '174397880+selvalabs@users.noreply.github.com'
          git add -A -- tools/global_reconciliation tests/global_reconciliation tests/global_rollout/verify.py config/editions.json data/global-integration/migration-status.json data/global-integration/reconciliation.json data/global03/publication-files.json docs/GLOBAL-04-RECONCILIATION.md
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'chore(d5): consolidar catálogo e fechamento funcional, sem alterar o produto #57'
          python tools/global_reconciliation/reconcile.py --check --verify --out "$RUNNER_TEMP/d5-preparation/preservation.json"
          git push origin HEAD:feat/global-04d5-reconciliation
          git rev-parse HEAD > "$RUNNER_TEMP/d5-preparation/executed-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-04D5-preparation
          path: ${{ runner.temp }}/d5-preparation
          retention-days: 30
