name: D5 one-shot manifest serialization alignment
on:
  push:
    branches: [feat/global-04d5-reconciliation]
    paths: ['.github/workflows/reconciliation-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.14.3 jsonschema==4.25.1
      - name: Preserve existing publication-generator JSON ordering
        run: |
          test "$GITHUB_REF" = refs/heads/feat/global-04d5-reconciliation
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/global_reconciliation/reconcile.py');s=p.read_text()
          old="'data/global03/publication-files.json':enc(manifest)"
          new="'data/global03/publication-files.json':json.dumps(manifest,ensure_ascii=False,indent=2)+'\\n'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python tools/global_reconciliation/reconcile.py --build
          python tools/global03/publication.py --prepare
          python tools/global_reconciliation/reconcile.py --check --verify
          python -m unittest discover -s tests/global_reconciliation -v
          git config user.name 'Selva Labs'
          git config user.email '174397880+selvalabs@users.noreply.github.com'
          git add tools/global_reconciliation/reconcile.py data/global03/publication-files.json
          git commit -m 'fix(d5): manter ordem do JSON do manifesto e determinismo #57'
          git push origin HEAD:feat/global-04d5-reconciliation
