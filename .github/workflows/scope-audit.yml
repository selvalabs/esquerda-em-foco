name: Canonical party scope audit 2026
on:
  push:
    branches: [feat/canonical-party-scope-2026]
    paths:
      - 'config/party-scope-2026.json'
      - 'tools/scope/**'
      - 'tests/scope/**'
      - '.github/workflows/scope-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-party-scope-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Audit official scope against project editions
        run: |
          git fetch origin feat/rs-deputados-estaduais:refs/remotes/origin/feat/rs-deputados-estaduais
          python tools/scope/audit.py
          python -m unittest discover -s tests/scope -p 'test_*.py' -v
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/methodology/party-scope-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(scope): reconcile SC RS PR against canonical party rule'
            git pull --rebase origin feat/canonical-party-scope-2026
            git push origin HEAD:feat/canonical-party-scope-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-party-scope-audit
          retention-days: 7
          path: docs/methodology/party-scope-audit.json
