name: RS estaduais — A-D source probe
on:
  push:
    branches: [feat/rs-deputados-estaduais]
    paths: ['tools/rs-estaduais/phase2_probe.py', '.github/workflows/rs-estaduais-phase2-probe.yml']
permissions:
  contents: read
concurrency:
  group: rs-estaduais-ad-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/feat/rs-deputados-estaduais'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rs-deputados-estaduais
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/rs-estaduais/phase2_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs-estaduais-ad-probe
          retention-days: 1
          path: /tmp/rs-phase2-probe/
