name: D1 one-shot reviewed source materialization
on:
  push:
    branches: [feat/global-04d1-taxonomy]
    paths: ['.github/workflows/d1-materialize.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4==4.13.4 jsonschema==4.25.1
      - name: Decode reviewed source paths; do not modify workflows with GITHUB_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/global-04d1-taxonomy'
          python - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          expected={'.github/workflows/global-filter-taxonomy.yml','data/global-integration/filter-inputs.json','docs/GLOBAL-FILTER-TAXONOMY.md','tests/global_filters/test_contract.py','tools/global_filters/build.py','tools/global_filters/check_expected.py','tools/global_filters/contract.py','tools/global_filters/decisions.py','tools/global_filters/expected.json','tools/global_filters/schema.py','tools/global_filters/verify_preservation.py'}
          parts=[Path(f'tools/global_filters/transport.{i}.b64') for i in range(2)]
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='5ba06285c4f099ad3d9685afac45f898a1c72ab7ad0e64024400168653995a00','Transport checksum differs'
          files=json.loads(lzma.decompress(raw));assert set(files)==expected
          for name,content in files.items():
              assert isinstance(content,str) and not Path(name).is_absolute() and '..' not in Path(name).parts
              p=Path(name)
              if name.startswith('.github/'):
                  assert p.read_text(encoding='utf-8')==content,'Workflow must have been installed separately and unchanged'
                  continue
              assert not p.exists(),f'Refusing to overwrite an existing source: {name}'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          for p in parts:p.unlink()
          PY
      - name: Generate and compare reviewed outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d1-materialize"
          python tools/global_filters/build.py
          python tools/global_filters/schema.py
          python tools/global_filters/check_expected.py
          python -m unittest discover -s tests/global_filters -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/d1-materialize/semantic-tests.txt"
      - name: Commit only contract sources and outputs on the integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/global-04d1-taxonomy'
          git config user.name 'Selva Labs'
          git config user.email '174397880+selvalabs@users.noreply.github.com'
          git add -A -- tools/global_filters tests/global_filters config/global-filter-taxonomy.json config/global-filter-taxonomy.schema.json data/global-integration/filter-crosswalk.json data/global-integration/filter-capabilities.json data/global-integration/filter-inputs.json data/global-integration/migration-status.json docs/GLOBAL-FILTER-TAXONOMY.md docs/GLOBAL-FILTER-CROSSWALK.md
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --stat
          git commit -m 'feat(global04d1): canonizar vocabulário e contrato de filtros #53'
          git push origin HEAD:feat/global-04d1-taxonomy
          git rev-parse HEAD > "$RUNNER_TEMP/d1-materialize/executed-commit.txt"
          printf 'Source tests passed; final preservation gate follows removal of this temporary workflow via the authorized connector.\n' > "$RUNNER_TEMP/d1-materialize/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-materialization-log
          path: ${{ runner.temp }}/d1-materialize
          retention-days: 30
