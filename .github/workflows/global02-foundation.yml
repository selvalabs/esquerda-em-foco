name: GLOBAL-02 foundation and immutable rehearsal
on:
  push:
    branches: [feat/global-02-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global02-foundation
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EEFOCO_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.4 jsonschema==4.25.1 playwright==1.55.0 Pillow==11.3.0 lxml==6.0.1
          python -m playwright install --with-deps chromium
      - name: Verify deterministic preparation without repository writes
        id: preparation
        shell: bash
        run: |
          set -euo pipefail
          python tools/global02/prepare.py --freeze
          git diff --exit-code
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/global02-results"
          git rev-parse HEAD > "$RUNNER_TEMP/global02-results/executed-commit.txt"
          git diff --stat cb845fcfb0b57f7907fd9d129555b6bb558a9ce1 > "$RUNNER_TEMP/global02-results/diff-stat.txt"
      - name: Pure query, collection and route contracts
        id: contracts
        shell: bash
        run: |
          set -o pipefail
          node --test tests/global02/core.test.cjs | tee "$RUNNER_TEMP/global02-results/core-tests.txt"
          node --test tests/sc_federais_filters.test.cjs tests/sc_semantic_v2_ui.test.cjs tests/sc_editorial_selected.test.cjs tests/sp/round_c/test_filters.cjs | tee "$RUNNER_TEMP/global02-results/existing-tests.txt"
      - name: Real generators, immutable files and branch-only AD3
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tests/global02/rebuild.py --out "$RUNNER_TEMP/global02-results/rebuild" | tee "$RUNNER_TEMP/global02-results/rebuild.log"
      - name: Browser rehearsal and public-export adapters
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          git worktree add --detach "$RUNNER_TEMP/global02-rs" c2bfa3ece357f21e8aa09e32f624a9e214ad9113
          python tests/global02/validate.py --out "$RUNNER_TEMP/global02-results/browser" --rs-root "$RUNNER_TEMP/global02-rs" | tee "$RUNNER_TEMP/global02-results/browser.log"
          git worktree remove --force "$RUNNER_TEMP/global02-rs"
      - name: Confirm preparation reproducibility and clean working tree
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/global02/prepare.py --freeze
          git diff --exit-code
          test -z "$(git status --porcelain)"
          printf 'passed\n' > "$RUNNER_TEMP/global02-results/clean-tree.txt"
      - name: Package source and evidence without publishing the rehearsal
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/global02-results/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/global02-results/source"
          rm -rf "$RUNNER_TEMP/global02-results/browser/server"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GLOBAL-02-foundation
          path: ${{ runner.temp }}/global02-results
          retention-days: 30
          include-hidden-files: true
